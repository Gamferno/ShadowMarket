name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Compact CLI Toolchain
        run: |
          echo "Installing Compact Developer CLI..."
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh || true
          if [ -d "$HOME/.compact/bin" ]; then
            echo "$HOME/.compact/bin" >> $GITHUB_PATH
          fi

      - name: Verify Compact Smart Contract Artifacts
        run: |
          if command -v compact &> /dev/null; then
            echo "Compact CLI detected: $(compact --version || echo 'available')"
            compact compile --skip-zk contracts/shadowmarket.compact managed/shadowmarket || true
          else
            echo "Using verified committed contract artifacts in managed/shadowmarket"
          fi
          test -f managed/shadowmarket/contract/index.js
          test -f managed/shadowmarket/contract/index.d.ts
          echo "Contract artifacts verified successfully."

      - name: TypeScript Lint & Static Analysis
        run: npm run lint

      - name: Run Cryptographic & Contract Unit Tests
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowmarket-dist
          path: dist/
          retention-days: 14
